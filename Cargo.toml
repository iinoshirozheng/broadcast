[workspace]
resolver = "3"
members = ["apps/cloud", "crates/*"]
# Joins the workspace at cutover, when it moves to apps/desktop and embeds the server.
exclude = ["src-tauri"]

[workspace.package]
version = "1.1.27"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
broadcast-domain = { path = "crates/domain" }
broadcast-agents = { path = "crates/agents" }
broadcast-codex = { path = "crates/codex" }
broadcast-store = { path = "crates/store" }

anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.23"
crossterm = { version = "0.29", default-features = false, features = ["events", "windows"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
form_urlencoded = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
regex = "1"
reqwest = { version = "0.13", features = ["stream"] }
hmac = "0.12"
if-addrs = "0.15"
nix = { version = "0.30", default-features = false, features = ["signal", "process"] }
rusqlite = { version = "0.41", features = ["bundled"] }
rusqlite_migration = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time", "fs", "io-util", "process"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
toml = "0.9"
tower = "0.5"
unicode-normalization = "0.1"
url = "2"
uuid = { version = "1", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
