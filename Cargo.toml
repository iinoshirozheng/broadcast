[workspace]
resolver = "3"
members = ["crates/*"]
# Joins the workspace at cutover, when it moves to apps/desktop and embeds the server.
exclude = ["src-tauri"]

[workspace.package]
version = "1.1.27"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
broadcast-domain = { path = "crates/domain" }
broadcast-store = { path = "crates/store" }

anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
form_urlencoded = "1"
hmac = "0.12"
rusqlite = { version = "0.41", features = ["bundled"] }
rusqlite_migration = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time", "fs", "io-util", "process"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower = "0.5"
url = "2"
uuid = { version = "1", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
