[package]
name = "broadcast-launcher"
description = "Broadcast launcher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
broadcast-agents.workspace = true
broadcast-codex.workspace = true
broadcast-server.workspace = true
futures-util.workspace = true
libc = "0.2"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-updater = "2.10.1"
tokio.workspace = true
url.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3.1"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "libc", "NSAlert", "NSApplication", "NSButton", "NSControl", "NSProgressIndicator", "NSResponder", "NSRunningApplication", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_RestartManager", "Win32_System_Threading"] }

# Not the workspace lints: the AppKit, libc and Win32 calls need `unsafe`.
[lints.clippy]
all = { level = "warn", priority = -1 }
