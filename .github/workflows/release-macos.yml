name: Release macOS

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  deployments: write

concurrency:
  group: release-macos-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release-preflight:
    name: Validate release tag and versions
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ steps.validate.outputs.release_tag }}
      package_version: ${{ steps.validate.outputs.package_version }}
      release_version: ${{ steps.validate.outputs.release_version }}
      prerelease: ${{ steps.validate.outputs.prerelease }}
      metadata: ${{ steps.validate.outputs.metadata }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.76.1
          activate-environment: true
          cache-write: false

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
          shared-key: ubuntu-24.04-x64
          cache-bin: false
          save-if: false

      - name: Validate release tag and versions
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          TAG_CREATED: ${{ github.event.created }}
          TAG_DELETED: ${{ github.event.deleted }}
          TAG_FORCED: ${{ github.event.forced }}
        run: |
          set -euo pipefail
          if [[ "$TAG_CREATED" != "true" || "$TAG_DELETED" == "true" || "$TAG_FORCED" == "true" ]]; then
            echo "发布标签必须是首次创建，不能删除或强制更新。" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          TAG_COMMIT="$(git rev-parse "$RELEASE_TAG^{}")"
          if [[ "$TAG_COMMIT" != "$GITHUB_SHA" ]]; then
            echo "标签提交与当前工作流提交不一致。" >&2
            exit 1
          fi
          git merge-base --is-ancestor "$TAG_COMMIT" origin/main

          REMOTE_TAG_COMMIT="$(git ls-remote origin "refs/tags/$RELEASE_TAG^{}" | awk 'NR == 1 { print $1 }')"
          if [[ -z "$REMOTE_TAG_COMMIT" ]]; then
            REMOTE_TAG_COMMIT="$(git ls-remote origin "refs/tags/$RELEASE_TAG" | awk 'NR == 1 { print $1 }')"
          fi
          if [[ "$REMOTE_TAG_COMMIT" != "$GITHUB_SHA" ]]; then
            echo "远程发布标签与当前工作流提交不一致。" >&2
            exit 1
          fi

          # Fails unless package.json, Cargo.toml and tauri.conf.json carry one numeric version
          # that the tag names.
          RELEASE_METADATA="$(cargo xtask release-metadata "$RELEASE_TAG")"
          PACKAGE_VERSION="$(jq -r '.packageVersion' <<< "$RELEASE_METADATA")"
          RELEASE_VERSION="$(jq -r '.releaseVersion' <<< "$RELEASE_METADATA")"
          PRERELEASE="$(jq -r '.prerelease' <<< "$RELEASE_METADATA")"

          RELEASE_CHECK="$RUNNER_TEMP/release-check.json"
          if ! RELEASE_STATUS="$(curl --silent --show-error \
            --output "$RELEASE_CHECK" \
            --write-out '%{http_code}' \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"; then
            echo "无法确认 Release 是否存在。" >&2
            exit 1
          fi
          case "$RELEASE_STATUS" in
            404) ;;
            200)
              echo "该标签或版本已存在 Release。" >&2
              exit 1
              ;;
            *)
              echo "查询 Release 失败，HTTP $RELEASE_STATUS。" >&2
              exit 1
              ;;
          esac

          RELEASES="$RUNNER_TEMP/releases.tsv"
          gh api \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            --paginate \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | [.tag_name, .draft, .prerelease, (.immutable // false), .target_commitish] | @tsv' \
            > "$RELEASES"
          cargo xtask check-release-order "$RELEASE_TAG" "$RELEASES" "$GITHUB_SHA"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "package_version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "release_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "metadata=$RELEASE_METADATA" >> "$GITHUB_OUTPUT"

  release-linux:
    name: Build Ubuntu 24.04 x64 packages
    needs: release-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      BROADCAST_RELEASE_VERSION: ${{ needs['release-preflight'].outputs.release_version }}
      PRODUCT_NAME: ${{ fromJSON(needs['release-preflight'].outputs.metadata).productName }}
      RELEASE_METADATA: ${{ needs['release-preflight'].outputs.metadata }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.76.1
          activate-environment: true
          cache-write: false

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
          shared-key: ubuntu-24.04-x64
          cache-bin: false

      - name: Install Ubuntu build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Ubuntu 24.04 x64 packages and updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: >-
          pnpm app:build:linux:x64
          --config "{\"productName\":\"$PRODUCT_NAME\",\"bundle\":{\"createUpdaterArtifacts\":true}}"

      - name: Verify Ubuntu 24.04 x64 package contents
        run: >-
          cargo xtask verify-linux-packages
          target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
          target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage

      - name: Stage Ubuntu 24.04 x64 release assets
        run: |
          LINUX_DEB_NAME="$(jq -r '.assets.linuxDeb' <<< "$RELEASE_METADATA")"
          LINUX_APPIMAGE_NAME="$(jq -r '.assets.linuxAppImage' <<< "$RELEASE_METADATA")"
          LINUX_RELEASE="$RUNNER_TEMP/linux-release"
          mkdir -p "$LINUX_RELEASE"
          cp \
            target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb \
            "$LINUX_RELEASE/$LINUX_DEB_NAME"
          cp \
            target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb.sig \
            "$LINUX_RELEASE/$LINUX_DEB_NAME.sig"
          cp \
            target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage \
            "$LINUX_RELEASE/$LINUX_APPIMAGE_NAME"
          cp \
            target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage.sig \
            "$LINUX_RELEASE/$LINUX_APPIMAGE_NAME.sig"

      - name: Preserve Ubuntu 24.04 x64 release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-release-${{ github.sha }}
          path: ${{ runner.temp }}/linux-release
          if-no-files-found: error

  release-windows-preview:
    name: Build unsigned Windows x64 Preview
    needs: release-preflight
    runs-on: windows-2025
    timeout-minutes: 40
    env:
      BROADCAST_RELEASE_VERSION: ${{ needs['release-preflight'].outputs.release_version }}
      PRODUCT_NAME: ${{ fromJSON(needs['release-preflight'].outputs.metadata).productName }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.76.1
          activate-environment: true
          cache-write: false

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
          shared-key: windows-x64
          cache-bin: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build unsigned Windows x64 Preview
        shell: bash
        run: pnpm app:build:windows --config "{\"productName\":\"$PRODUCT_NAME\"}"

      - name: Preserve unsigned Windows x64 Preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-preview-${{ github.sha }}
          path: target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  release-macos:
    name: Build signed universal macOS app
    needs: release-preflight
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      BROADCAST_RELEASE_VERSION: ${{ needs['release-preflight'].outputs.release_version }}
      RELEASE_TAG: ${{ needs['release-preflight'].outputs.release_tag }}
      PACKAGE_VERSION: ${{ needs['release-preflight'].outputs.package_version }}
      APP_NAME: ${{ fromJSON(needs['release-preflight'].outputs.metadata).appName }}
      PRODUCT_NAME: ${{ fromJSON(needs['release-preflight'].outputs.metadata).productName }}
      RELEASE_METADATA: ${{ needs['release-preflight'].outputs.metadata }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.76.1
          environments: macos-release
          activate-environment: true
          cache-write: false

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
          shared-key: macos-universal
          cache-bin: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare App Store Connect API key
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          umask 077
          APPLE_API_KEY_PATH="$RUNNER_TEMP/app-store-connect.p8"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$APPLE_API_KEY_PATH"
          echo "APPLE_API_KEY_PATH=$APPLE_API_KEY_PATH" >> "$GITHUB_ENV"

      # Tauri imports the Developer ID certificate into a temporary keychain, signs the
      # sidecar and the App with the hardened runtime, notarizes and staples the App, builds and
      # signs the DMG from it, and signs the updater archive.
      - name: Build, sign and notarize the universal App, DMG and updater archive
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: >-
          pnpm tauri build --target universal-apple-darwin --bundles app,dmg --ci
          --config "{\"productName\":\"$PRODUCT_NAME\"}"

      - name: Notarize and staple the DMG
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          DMG_PATH="target/universal-apple-darwin/release/bundle/dmg/$(jq -r '.tauriDmgName' <<< "$RELEASE_METADATA")"
          xcrun notarytool submit "$DMG_PATH" \
            --key-id "$APPLE_API_KEY" \
            --key "$APPLE_API_KEY_PATH" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple -v "$DMG_PATH"

      - name: Stage the public macOS release assets
        run: |
          set -euo pipefail
          BUNDLE_ROOT="target/universal-apple-darwin/release/bundle"
          MACOS_RELEASE="$RUNNER_TEMP/macos-release"
          TAURI_UPDATER_NAME="$(jq -r '.tauriUpdaterName' <<< "$RELEASE_METADATA")"
          UPDATER_NAME="$(jq -r '.assets.macosUpdater' <<< "$RELEASE_METADATA")"
          mkdir -p "$MACOS_RELEASE"
          cp \
            "$BUNDLE_ROOT/dmg/$(jq -r '.tauriDmgName' <<< "$RELEASE_METADATA")" \
            "$MACOS_RELEASE/$(jq -r '.assets.dmg' <<< "$RELEASE_METADATA")"
          cp "$BUNDLE_ROOT/macos/$TAURI_UPDATER_NAME" "$MACOS_RELEASE/$UPDATER_NAME"
          cp "$BUNDLE_ROOT/macos/$TAURI_UPDATER_NAME.sig" "$MACOS_RELEASE/$UPDATER_NAME.sig"
          cargo xtask macos-latest-json "$RELEASE_TAG" "$MACOS_RELEASE"

      - name: Verify the signed release assets
        run: |
          set -euo pipefail
          MACOS_RELEASE="$RUNNER_TEMP/macos-release"
          cargo xtask verify-macos \
            "target/universal-apple-darwin/release/bundle/macos/$APP_NAME" \
            "$MACOS_RELEASE/$(jq -r '.assets.dmg' <<< "$RELEASE_METADATA")" \
            "$MACOS_RELEASE/$(jq -r '.assets.macosUpdater' <<< "$RELEASE_METADATA")" \
            --release "$RELEASE_TAG"

      - name: Preserve final public macOS release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-release-${{ github.sha }}
          path: ${{ runner.temp }}/macos-release
          if-no-files-found: error
          retention-days: 1

      - name: Remove temporary signing files
        if: always()
        run: rm -f "$RUNNER_TEMP/app-store-connect.p8"

  draft-release:
    name: Create draft release
    needs:
      - release-preflight
      - release-linux
      - release-windows-preview
      - release-macos
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ needs['release-preflight'].outputs.release_tag }}
      PACKAGE_VERSION: ${{ needs['release-preflight'].outputs.package_version }}
      PRERELEASE: ${{ needs['release-preflight'].outputs.prerelease }}
      RELEASE_METADATA: ${{ needs['release-preflight'].outputs.metadata }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.76.1
          activate-environment: true
          cache-write: false

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
          shared-key: ubuntu-24.04-x64
          cache-bin: false
          save-if: false

      - name: Restore final public macOS release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-release-${{ github.sha }}
          path: ${{ runner.temp }}/macos-release

      - name: Restore unsigned Windows x64 Preview
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-preview-${{ github.sha }}
          path: ${{ runner.temp }}/windows-preview

      - name: Restore Ubuntu 24.04 x64 release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: linux-release-${{ github.sha }}
          path: ${{ runner.temp }}/linux-release

      - name: Add and verify the Linux x64 updater
        run: |
          LATEST_PATH="$RUNNER_TEMP/macos-release/latest.json"
          LINUX_DEB_NAME="$(jq -r '.assets.linuxDeb' <<< "$RELEASE_METADATA")"
          LINUX_APPIMAGE_NAME="$(jq -r '.assets.linuxAppImage' <<< "$RELEASE_METADATA")"
          LINUX_DEB="$RUNNER_TEMP/linux-release/$LINUX_DEB_NAME"
          LINUX_APPIMAGE="$RUNNER_TEMP/linux-release/$LINUX_APPIMAGE_NAME"
          jq \
            --rawfile deb_signature "$LINUX_DEB.sig" \
            --rawfile appimage_signature "$LINUX_APPIMAGE.sig" \
            --arg deb_url "https://github.com/iinoshirozheng/broadcast/releases/download/$RELEASE_TAG/$LINUX_DEB_NAME" \
            --arg appimage_url "https://github.com/iinoshirozheng/broadcast/releases/download/$RELEASE_TAG/$LINUX_APPIMAGE_NAME" \
            '.platforms["linux-x86_64-deb"] = {signature: $deb_signature, url: $deb_url}
             | .platforms["linux-x86_64-appimage"] = {signature: $appimage_signature, url: $appimage_url}' \
            "$LATEST_PATH" > "$LATEST_PATH.linux"
          mv "$LATEST_PATH.linux" "$LATEST_PATH"
          cargo xtask verify-linux-updater \
            "$LINUX_DEB" \
            "$LINUX_APPIMAGE" \
            "$LATEST_PATH" \
            "$RELEASE_TAG"

      - name: Create trusted release asset manifest
        run: |
          set -euo pipefail
          MACOS_RELEASE="$RUNNER_TEMP/macos-release"
          RELEASE_ASSETS="$RUNNER_TEMP/release-assets"
          MANIFEST_ROOT="$RUNNER_TEMP/release-manifest"
          PUBLIC_DMG_NAME="$(jq -r '.assets.dmg' <<< "$RELEASE_METADATA")"
          UPDATER_NAME="$(jq -r '.assets.macosUpdater' <<< "$RELEASE_METADATA")"
          WINDOWS_INSTALLER_NAME="$(jq -r '.assets.windowsInstaller' <<< "$RELEASE_METADATA")"
          LINUX_DEB_NAME="$(jq -r '.assets.linuxDeb' <<< "$RELEASE_METADATA")"
          LINUX_APPIMAGE_NAME="$(jq -r '.assets.linuxAppImage' <<< "$RELEASE_METADATA")"
          mapfile -t ASSET_NAMES < <(jq -r '.assetNames[]' <<< "$RELEASE_METADATA")
          mkdir -p "$RELEASE_ASSETS" "$MANIFEST_ROOT"
          cp "$MACOS_RELEASE/$PUBLIC_DMG_NAME" "$RELEASE_ASSETS/"
          cp "$MACOS_RELEASE/$UPDATER_NAME" "$RELEASE_ASSETS/"
          cp "$MACOS_RELEASE/$UPDATER_NAME.sig" "$RELEASE_ASSETS/"
          cp "$MACOS_RELEASE/latest.json" "$RELEASE_ASSETS/"
          cp \
            "$RUNNER_TEMP/windows-preview/"*-setup.exe \
            "$RELEASE_ASSETS/$WINDOWS_INSTALLER_NAME"
          cp \
            "$RUNNER_TEMP/linux-release/$LINUX_DEB_NAME" \
            "$RELEASE_ASSETS/"
          cp \
            "$RUNNER_TEMP/linux-release/$LINUX_DEB_NAME.sig" \
            "$RELEASE_ASSETS/"
          cp \
            "$RUNNER_TEMP/linux-release/$LINUX_APPIMAGE_NAME" \
            "$RELEASE_ASSETS/"
          cp \
            "$RUNNER_TEMP/linux-release/$LINUX_APPIMAGE_NAME.sig" \
            "$RELEASE_ASSETS/"
          (
            cd "$RELEASE_ASSETS"
            shasum -a 256 "${ASSET_NAMES[@]}" > "$MANIFEST_ROOT/release-assets.sha256"
          )

      - name: Preserve trusted release asset manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-release-${{ github.sha }}-sha256
          path: ${{ runner.temp }}/release-manifest/release-assets.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_ASSETS="$RUNNER_TEMP/release-assets"
          ASSET_PATHS=()
          while read -r SHA256 ASSET_NAME; do
            ASSET_PATHS+=("$RELEASE_ASSETS/$ASSET_NAME")
          done < "$RUNNER_TEMP/release-manifest/release-assets.sha256"
          RELEASE_FLAGS=(--draft)
          if [[ "$PRERELEASE" == "true" ]]; then
            RELEASE_FLAGS+=(--prerelease --latest=false)
          elif [[ "$PRERELEASE" != "false" ]]; then
            echo "无效的 prerelease 状态：$PRERELEASE" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --target "$GITHUB_SHA" \
            "${RELEASE_FLAGS[@]}" \
            --title "Broadcast $RELEASE_TAG" \
            --generate-notes \
            "${ASSET_PATHS[0]}"
          gh release upload "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            "${ASSET_PATHS[@]:1}"

  promote-release:
    name: Verify and publish immutable release
    needs:
      - release-preflight
      - draft-release
    if: ${{ !cancelled() && needs['release-preflight'].result == 'success' && needs['draft-release'].result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: macos-release
    env:
      RELEASE_TAG: ${{ needs['release-preflight'].outputs.release_tag }}
      PACKAGE_VERSION: ${{ needs['release-preflight'].outputs.package_version }}
      EXPECTED_PRERELEASE: ${{ needs['release-preflight'].outputs.prerelease }}

    steps:
      - name: Validate protected release promotion
        env:
          RULESET_TOKEN: ${{ secrets.RELEASE_RULESET_TOKEN }}
        run: |
          set -euo pipefail
          API_VERSION_HEADER="X-GitHub-Api-Version: 2026-03-10"
          if [[ "$EXPECTED_PRERELEASE" != "true" && "$EXPECTED_PRERELEASE" != "false" ]]; then
            echo "promotion 收到无效的 prerelease 状态。" >&2
            exit 1
          fi
          if [[ -z "$RULESET_TOKEN" ]]; then
            echo "缺少 RELEASE_RULESET_TOKEN，无法确认标签 Ruleset 的绕过者。" >&2
            exit 1
          fi
          if ! RULESET_IDS="$(GH_TOKEN="$RULESET_TOKEN" gh api \
            --header "$API_VERSION_HEADER" \
            --paginate \
            "repos/$GITHUB_REPOSITORY/rulesets?targets=tag&per_page=100" \
            --jq '.[].id')"; then
            echo "无法读取标签 Ruleset。" >&2
            exit 1
          fi

          TAG_RULE_PROTECTED=false
          while IFS= read -r RULESET_ID; do
            [[ -n "$RULESET_ID" ]] || continue
            if ! RULESET="$(GH_TOKEN="$RULESET_TOKEN" gh api \
              --header "$API_VERSION_HEADER" \
              "repos/$GITHUB_REPOSITORY/rulesets/$RULESET_ID")"; then
              echo "无法读取标签 Ruleset $RULESET_ID。" >&2
              exit 1
            fi
            if jq -e --arg tag_ref "refs/tags/$RELEASE_TAG" '
              .target == "tag" and
              .enforcement == "active" and
              has("bypass_actors") and
              ((.bypass_actors | type) == "array") and
              ((.bypass_actors | length) == 0) and
              ((.conditions.ref_name.include | type) == "array") and
              any(
                .conditions.ref_name.include[]?;
                . == $tag_ref or
                (
                  . == "refs/tags/v*" and
                  ($tag_ref | test("^refs/tags/v[^/]*$"))
                )
              ) and
              ((.conditions.ref_name.exclude | type) == "array") and
              ((.conditions.ref_name.exclude | length) == 0) and
              ((.rules | type) == "array") and
              any(.rules[]?; .type == "update") and
              any(.rules[]?; .type == "deletion")
            ' <<< "$RULESET" >/dev/null; then
              TAG_RULE_PROTECTED=true
              break
            fi
          done <<< "$RULESET_IDS"
          if [[ "$TAG_RULE_PROTECTED" != "true" ]]; then
            echo "发布前必须启用覆盖当前标签的规则：exclude 为空、禁止更新和删除，并且 bypass_actors 字段可见且为空。" >&2
            exit 1
          fi

          if ! IMMUTABLE_RELEASES="$(GH_TOKEN="$RULESET_TOKEN" gh api \
            --header "$API_VERSION_HEADER" \
            "repos/$GITHUB_REPOSITORY/immutable-releases")"; then
            echo "仓库必须在 promotion 前启用 immutable releases。" >&2
            exit 1
          fi
          if ! jq -e '.enabled == true' <<< "$IMMUTABLE_RELEASES" >/dev/null; then
            echo "仓库的 immutable releases 未启用。" >&2
            exit 1
          fi

      - name: Restore trusted release asset manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-release-${{ github.sha }}-sha256
          path: ${{ runner.temp }}/trusted-release-manifest

      - name: Verify Draft Release digests and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API_VERSION_HEADER="X-GitHub-Api-Version: 2026-03-10"
          MANIFEST_PATH="$RUNNER_TEMP/trusted-release-manifest/release-assets.sha256"
          LATEST_PATH="$RUNNER_TEMP/release-latest.json"
          FIRST_ASSET_NAME="$(awk 'NR == 1 { print $2 }' "$MANIFEST_PATH")"
          RELEASES="$(gh api --header "$API_VERSION_HEADER" \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100")"
          DRAFT_RELEASE="$(jq -c \
            --arg tag "$RELEASE_TAG" \
            '[.[] | select(.tag_name == $tag and .draft == true)] | if length == 1 then .[0] else empty end' \
            <<< "$RELEASES")"
          if [[ -z "$DRAFT_RELEASE" ]]; then
            echo "找不到唯一的目标 Draft Release。" >&2
            exit 1
          fi
          EXPECTED_ASSET_COUNT="$(wc -l < "$MANIFEST_PATH" | tr -d ' ')"

          if ! jq -e \
            --arg tag "$RELEASE_TAG" \
            --arg target "$GITHUB_SHA" \
            --arg first_asset "$FIRST_ASSET_NAME" \
            --argjson prerelease "$EXPECTED_PRERELEASE" \
            --argjson asset_count "$EXPECTED_ASSET_COUNT" \
            '.tag_name == $tag and
             .target_commitish == $target and
             .draft == true and
             .prerelease == $prerelease and
             (.assets | length) == $asset_count and
             .assets[0].name == $first_asset and
             all(.assets[]; .state == "uploaded")' \
            <<< "$DRAFT_RELEASE" >/dev/null; then
            echo "发布前 Draft Release、通道、DMG 首位或资产集合发生变化。" >&2
            exit 1
          fi

          while read -r SHA256 ASSET_NAME; do
            if ! jq -e \
              --arg name "$ASSET_NAME" \
              --arg digest "sha256:$SHA256" \
              'any(.assets[]; .name == $name and .digest == $digest)' \
              <<< "$DRAFT_RELEASE" >/dev/null; then
              echo "发布前资产 $ASSET_NAME 的 SHA-256 与构建 manifest 不一致。" >&2
              exit 1
            fi
          done < "$MANIFEST_PATH"

          if ! REMOTE_TAG_COMMIT="$(gh api \
            --header "$API_VERSION_HEADER" \
            "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" \
            --jq '.sha')"; then
            echo "发布前无法重新读取远程标签。" >&2
            exit 1
          fi
          if [[ "$REMOTE_TAG_COMMIT" != "$GITHUB_SHA" ]]; then
            echo "发布前远程标签与构建提交不一致。" >&2
            exit 1
          fi

          LATEST_ASSET_ID="$(jq -r \
            '[.assets[] | select(.name == "latest.json")] | if length == 1 then .[0].id else empty end' \
            <<< "$DRAFT_RELEASE")"
          EXPECTED_LATEST_SHA256="$(awk '$2 == "latest.json" { print $1 }' "$MANIFEST_PATH")"
          if [[ -z "$LATEST_ASSET_ID" || -z "$EXPECTED_LATEST_SHA256" ]]; then
            echo "Draft Release 或 manifest 缺少唯一的 latest.json。" >&2
            exit 1
          fi
          gh api \
            --header "$API_VERSION_HEADER" \
            --header "Accept: application/octet-stream" \
            "repos/$GITHUB_REPOSITORY/releases/assets/$LATEST_ASSET_ID" \
            > "$LATEST_PATH"
          ACTUAL_LATEST_SHA256="$(sha256sum "$LATEST_PATH" | awk '{ print $1 }')"
          if [[ "$ACTUAL_LATEST_SHA256" != "$EXPECTED_LATEST_SHA256" ]]; then
            echo "下载的 latest.json 与构建 manifest 不一致。" >&2
            exit 1
          fi
          jq -e . "$LATEST_PATH" >/dev/null

          RELEASE_ID="$(jq -r '.id' <<< "$DRAFT_RELEASE")"
          gh api --header "$API_VERSION_HEADER" \
            --method PATCH \
            -F draft=false \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" >/dev/null

      - name: Verify final immutable Release and assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API_VERSION_HEADER="X-GitHub-Api-Version: 2026-03-10"
          MANIFEST_PATH="$RUNNER_TEMP/trusted-release-manifest/release-assets.sha256"
          FIRST_ASSET_NAME="$(awk 'NR == 1 { print $2 }' "$MANIFEST_PATH")"
          FINAL_RELEASE="$(gh api --header "$API_VERSION_HEADER" \
            "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
          LATEST_RELEASE="$(gh api --header "$API_VERSION_HEADER" \
            "repos/$GITHUB_REPOSITORY/releases/latest")"
          EXPECTED_ASSET_COUNT="$(wc -l < "$MANIFEST_PATH" | tr -d ' ')"

          if ! jq -e \
            --arg tag "$RELEASE_TAG" \
            --arg target "$GITHUB_SHA" \
            --arg first_asset "$FIRST_ASSET_NAME" \
            --argjson prerelease "$EXPECTED_PRERELEASE" \
            --argjson asset_count "$EXPECTED_ASSET_COUNT" \
            '.tag_name == $tag and
             .target_commitish == $target and
             .draft == false and
             .prerelease == $prerelease and
             .immutable == true and
             (.assets | length) == $asset_count and
             .assets[0].name == $first_asset and
             all(.assets[]; .state == "uploaded")' \
            <<< "$FINAL_RELEASE" >/dev/null; then
            echo "最终 Release 的发布、通道、锁定、DMG 首位或资产状态不正确。" >&2
            exit 1
          fi

          if [[ "$EXPECTED_PRERELEASE" == "true" ]]; then
            if ! jq -e --arg tag "$RELEASE_TAG" \
              '.draft == false and .prerelease == false and .tag_name != $tag' \
              <<< "$LATEST_RELEASE" >/dev/null; then
              echo "Beta Release 不得成为 GitHub latest。" >&2
              exit 1
            fi
          elif ! jq -e --arg tag "$RELEASE_TAG" \
            '.draft == false and .prerelease == false and .tag_name == $tag' \
            <<< "$LATEST_RELEASE" >/dev/null; then
            echo "正式 Release 必须成为 GitHub latest。" >&2
            exit 1
          fi

          while read -r SHA256 ASSET_NAME; do
            if ! jq -e \
              --arg name "$ASSET_NAME" \
              --arg digest "sha256:$SHA256" \
              'any(.assets[]; .name == $name and .digest == $digest)' \
              <<< "$FINAL_RELEASE" >/dev/null; then
              echo "最终资产 $ASSET_NAME 的 SHA-256 与构建 manifest 不一致。" >&2
              exit 1
            fi
          done < "$MANIFEST_PATH"

      - name: Update and verify Beta updater metadata
        if: env.EXPECTED_PRERELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API_VERSION_HEADER="X-GitHub-Api-Version: 2026-03-10"
          BETA_FEED_BRANCH="beta-updater"
          BETA_FEED_PATH="latest.json"
          LATEST_PATH="$RUNNER_TEMP/release-latest.json"
          REMOTE_LATEST_PATH="$RUNNER_TEMP/beta-updater-latest.json"

          if ! gh api --header "$API_VERSION_HEADER" \
            "repos/$GITHUB_REPOSITORY/git/ref/heads/$BETA_FEED_BRANCH" >/dev/null 2>&1; then
            gh api --header "$API_VERSION_HEADER" \
              --method POST \
              -f ref="refs/heads/$BETA_FEED_BRANCH" \
              -f sha="$GITHUB_SHA" \
              "repos/$GITHUB_REPOSITORY/git/refs" >/dev/null
          fi

          FILE_SHA="$(gh api --header "$API_VERSION_HEADER" \
            "repos/$GITHUB_REPOSITORY/contents/$BETA_FEED_PATH?ref=$BETA_FEED_BRANCH" \
            --jq '.sha' 2>/dev/null || true)"
          CONTENT="$(base64 < "$LATEST_PATH" | tr -d '\n')"
          UPDATE_ARGS=(
            --method PUT
            -f "message=Update Beta updater metadata for $RELEASE_TAG"
            -f "content=$CONTENT"
            -f "branch=$BETA_FEED_BRANCH"
          )
          if [[ -n "$FILE_SHA" ]]; then
            UPDATE_ARGS+=(-f "sha=$FILE_SHA")
          fi
          UPDATE_RESULT="$(gh api --header "$API_VERSION_HEADER" \
            "${UPDATE_ARGS[@]}" \
            "repos/$GITHUB_REPOSITORY/contents/$BETA_FEED_PATH")"
          UPDATED_FILE_SHA="$(jq -r '.content.sha // empty' <<< "$UPDATE_RESULT")"
          if [[ -z "$UPDATED_FILE_SHA" ]]; then
            echo "Beta updater metadata 更新未返回文件 SHA。" >&2
            exit 1
          fi

          REMOTE_FILE="$(gh api --header "$API_VERSION_HEADER" \
            "repos/$GITHUB_REPOSITORY/contents/$BETA_FEED_PATH?ref=$BETA_FEED_BRANCH")"
          if [[ "$(jq -r '.sha // empty' <<< "$REMOTE_FILE")" != "$UPDATED_FILE_SHA" ]]; then
            echo "Beta updater metadata 回读 SHA 与写入结果不一致。" >&2
            exit 1
          fi
          jq -r '.content' <<< "$REMOTE_FILE" \
            | tr -d '\n' \
            | base64 --decode \
            > "$REMOTE_LATEST_PATH"
          if ! cmp -s "$LATEST_PATH" "$REMOTE_LATEST_PATH"; then
            echo "Beta updater metadata 回读内容与已验证 Release metadata 不一致。" >&2
            exit 1
          fi
