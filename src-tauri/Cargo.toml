[package]
name = "broadcast-launcher"
version = "1.1.27"
description = "Broadcast launcher"
edition = "2021"
rust-version = "1.100"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
broadcast-codex = { path = "../crates/codex" }
broadcast-server = { path = "../crates/server" }
futures-util = "0.3"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-updater = "2.10.1"
tokio = { version = "1", features = ["net", "rt", "sync", "macros"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3.1"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "libc", "NSAlert", "NSApplication", "NSButton", "NSControl", "NSProgressIndicator", "NSResponder", "NSRunningApplication", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_RestartManager", "Win32_System_Threading"] }
